plugins {
    id 'com.android.application'
}

def versionFile = rootProject.file('../VERSION')
if (!versionFile.exists()) {
    throw new GradleException("Missing repository VERSION file: ${versionFile}")
}
def appVersion = versionFile.text.trim()
def versionParts = appVersion.tokenize('.')
if (versionParts.size() != 3 || versionParts.any { !it.isInteger() }) {
    throw new GradleException("VERSION must contain a semantic version such as 2.2.0")
}
def appVersionCode = versionParts[0].toInteger() * 10000 + versionParts[1].toInteger() * 100 + versionParts[2].toInteger()

android {
    namespace 'com.dedgram.collector'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.dedgram.collector'
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersion
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        // Optimized installable build for device testing. It uses the debug key so
        // upgrades preserve the installed app's local data and accessibility state.
        create('preview') {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks += ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

def syncPreviewApkToAppRoot = tasks.register('syncPreviewApkToAppRoot', DefaultTask) {
    doNotTrackState('The destination is the app project root, outside the build directory.')
    def builtApk = layout.buildDirectory.file('outputs/apk/preview/app-preview.apk')
    dependsOn('packagePreview')
    inputs.file(builtApk)
    doLast {
        java.nio.file.Files.copy(
                builtApk.get().asFile.toPath(),
                rootProject.file('dedgram.apk').toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
}

tasks.matching { it.name == 'assemblePreview' }.configureEach {
    finalizedBy(syncPreviewApkToAppRoot)
}
