plugins {
    id 'com.android.application'
}

def versionFile = rootProject.file('../VERSION')
if (!versionFile.exists()) {
    throw new GradleException("Missing repository VERSION file: ${versionFile}")
}
def appVersion = versionFile.text.trim()
def versionParts = appVersion.tokenize('.')
if (versionParts.size() != 3 || versionParts.any { !it.isInteger() }) {
    throw new GradleException("VERSION must contain a semantic version such as 2.2.0")
}
def appVersionCode = versionParts[0].toInteger() * 10000 + versionParts[1].toInteger() * 100 + versionParts[2].toInteger()

android {
    namespace 'com.dedgram.collector'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.dedgram.collector'
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersion
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
